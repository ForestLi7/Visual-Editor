# 开发机反代：nginx → 本机 Vite 127.0.0.1:5174
# 须与本机 editor/.env.development 中 VE_BASE_PATH、VE_PUBLIC_ORIGIN 一致

location /visual-editor/ {
    proxy_pass http://127.0.0.1:5174/visual-editor/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Vite 开发态 HMR WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 32m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# 在 http { } 内增加（若还没有）：
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# 若仍出现 main.tsx MIME 为 text/html：说明脚本请求到了 /src 而非 /visual-editor/src
# → 本机勿设 VE_BASE_PATH=/，用 editor/.env.development 并重启 npm run dev

# 仍 403 时可临时：
# proxy_set_header Host 127.0.0.1:5174;
